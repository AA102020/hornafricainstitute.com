<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">Horn of Africa, Red Sea, and Gulf regional system</title>
<desc id="desc">A regional systems map showing the Horn of Africa as a unified region connected to Egypt, Israel, the Red Sea, Gulf states, major ports, and the Suez, Bab el-Mandeb, and Hormuz choke points. Somalia is shown as one sovereign country without an internal international boundary.</desc>
